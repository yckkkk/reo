<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>今日复习</title>
<style>
:root,
[data-theme='light'] {
  color-scheme: light;

  --brand-red: #dc2626;
  --brand-magenta: #d946ef;
  --brand-ember: #ff4704;
  --brand-gradient-from: #ff6a33;
  --brand-gradient-via: #ef4444;
  --brand-gradient-to: #e879f9;
  --brand-gradient: linear-gradient(
    135deg,
    var(--brand-gradient-from) 0%,
    var(--brand-gradient-via) 50%,
    var(--brand-gradient-to) 100%
  );

  --surface-1: #ffffff;
  --surface-2: #f4f4f5;
  --surface-3: #ebebed;
  --surface-4: #ffffff;

  --background: var(--surface-1);
  --foreground: #18181b;
  --card: var(--surface-2);
  --card-foreground: #18181b;
  --popover: var(--surface-4);
  --popover-foreground: #18181b;
  --primary: #18181b;
  --primary-foreground: var(--background);
  --primary-hover: color-mix(in oklab, var(--primary) 86%, var(--background));
  --secondary: #dfe3e8;
  --secondary-foreground: #18181b;
  --muted: var(--surface-2);
  --muted-foreground: #71717a;
  --accent: #d4d9e0;
  --accent-foreground: #18181b;
  --destructive: #b91c1c;
  --destructive-hover: color-mix(in oklab, var(--destructive) 82%, var(--destructive-foreground));
  --destructive-foreground: #ffffff;
  --scrim: rgb(24 24 27 / 0.32);
  --border: transparent;
  --input: var(--surface-3);
  --ring: var(--primary);

  --font-sans: 'Waldenburg', 'Inter', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --font-memory-serif: 'Songti SC', STSong, 'Noto Serif CJK SC', serif;

  --tracking-heading: 0;
  --tracking-heading-lg: 0;
  --tracking-display: 0;
  --tracking-wide: 0.05em;
  --tracking-wider: 0.1em;

  --text-caption: 10px;
  --leading-caption: 1.4;
  --text-ui-xs: 11px;
  --leading-ui-xs: 1.5;
  --text-ui-sm: 12px;
  --leading-ui-sm: 1.6;
  --text-ui-md: 13px;
  --leading-ui-md: 1.6;
  --text-body: 14px;
  --leading-body: 1.6;
  --text-body-lg: 16px;
  --leading-body-lg: 1.6;
  --text-subheading: 18px;
  --leading-subheading: 1.5;
  --text-heading-sm: 20px;
  --leading-heading-sm: 1.4;
  --text-heading: 32px;
  --leading-heading: 1.2;
  --text-heading-lg: 36px;
  --leading-heading-lg: 1.2;
  --text-display: 48px;
  --leading-display: 1.1;

  --font-weight-light: 300;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-bold: 600;

  --spacing-unit: 4px;
  --spacing-4: 4px;
  --spacing-8: 8px;
  --spacing-12: 12px;
  --spacing-16: 16px;
  --spacing-20: 20px;
  --spacing-24: 24px;
  --spacing-28: 28px;
  --spacing-32: 32px;
  --spacing-36: 36px;
  --spacing-40: 40px;
  --spacing-48: 48px;
  --spacing-56: 56px;
  --spacing-64: 64px;
  --spacing-72: 72px;
  --spacing-96: 96px;
  --spacing-160: 160px;

  --container-form: 720px;

  --radius: 16px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-3xl: 28px;
  --radius-4xl: 32px;
  --radius-full: 9999px;

  --shadow-float:
    0 16px 48px rgb(17 24 39 / 0.04), 0 12px 24px rgb(17 24 39 / 0.04),
    0 6px 8px rgb(17 24 39 / 0.02), 0 2px 3px rgb(17 24 39 / 0.02);
  --shadow-modal:
    0 32px 64px rgb(17 24 39 / 0.08), 0 16px 32px rgb(17 24 39 / 0.06),
    0 8px 16px rgb(17 24 39 / 0.04), 0 2px 4px rgb(17 24 39 / 0.03);
  --shadow-hero-lift: 0 24px 48px rgb(220 38 38 / 0.12), inset 0 1px 0 rgb(255 255 255 / 0.6);
  --shadow-hero-fill: 0 12px 24px rgb(220 38 38 / 0.18), inset 0 0 0 1px rgb(255 255 255 / 0.14);
  --shadow-hero-inset: inset 0 1px 0 rgb(255 255 255 / 0.35), inset 0 -8px 16px rgb(0 0 0 / 0.12);
  --shadow-hero-edge: inset 0 0 0 1px rgb(255 255 255 / 0.08), inset 0 1px 0 rgb(255 255 255 / 0.4);
  --shadow-surface-inset: inset 0 1px 0 rgb(0 0 0 / 0.02);
}

[data-theme='dark'] {
  color-scheme: dark;

  --brand-red: #dc2626;
  --brand-magenta: #d946ef;
  --brand-ember: #ff4704;
  --brand-gradient-from: color-mix(in oklab, var(--brand-ember) 92%, var(--surface-1));
  --brand-gradient-via: color-mix(in oklab, var(--brand-red) 92%, var(--surface-1));
  --brand-gradient-to: color-mix(in oklab, var(--brand-magenta) 92%, var(--surface-1));

  --surface-1: #09090b;
  --surface-2: #18181b;
  --surface-3: #1f1f23;
  --surface-4: #27272a;

  --background: var(--surface-1);
  --foreground: #fafafa;
  --card: var(--surface-2);
  --card-foreground: #fafafa;
  --popover: var(--surface-4);
  --popover-foreground: #fafafa;
  --primary: #fafafa;
  --primary-foreground: var(--background);
  --primary-hover: color-mix(in oklab, var(--primary) 86%, var(--background));
  --secondary: #27272a;
  --secondary-foreground: #fafafa;
  --muted: var(--surface-2);
  --muted-foreground: #a1a1aa;
  --accent: color-mix(in oklab, var(--foreground) 10%, var(--popover));
  --accent-foreground: #fafafa;
  --destructive: #b91c1c;
  --destructive-hover: color-mix(in oklab, var(--destructive) 82%, var(--destructive-foreground));
  --destructive-foreground: #ffffff;
  --scrim: rgb(0 0 0 / 0.62);
  --border: transparent;
  --input: var(--surface-3);
  --ring: var(--primary);

  --shadow-float:
    0 16px 48px rgb(0 0 0 / 0.5), 0 12px 24px rgb(0 0 0 / 0.24), 0 6px 8px rgb(0 0 0 / 0.22),
    0 2px 3px rgb(0 0 0 / 0.12);
  --shadow-modal:
    0 32px 64px rgb(0 0 0 / 0.6), 0 16px 32px rgb(0 0 0 / 0.32), 0 8px 16px rgb(0 0 0 / 0.28),
    0 2px 4px rgb(0 0 0 / 0.16);
  --shadow-hero-lift: 0 24px 48px rgb(220 38 38 / 0.22), inset 0 1px 0 rgb(255 255 255 / 0.06);
  --shadow-hero-fill: 0 12px 24px rgb(220 38 38 / 0.28), inset 0 0 0 1px rgb(255 255 255 / 0.14);
  --shadow-hero-inset: inset 0 1px 0 rgb(255 255 255 / 0.25), inset 0 -8px 16px rgb(0 0 0 / 0.18);
  --shadow-hero-edge: inset 0 0 0 1px rgb(255 255 255 / 0.05), inset 0 1px 0 rgb(255 255 255 / 0.2);
  --shadow-surface-inset: inset 0 1px 0 rgb(255 255 255 / 0.04);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    color-scheme: dark;

    --brand-gradient-from: color-mix(in oklab, var(--brand-ember) 92%, var(--surface-1));
    --brand-gradient-via: color-mix(in oklab, var(--brand-red) 92%, var(--surface-1));
    --brand-gradient-to: color-mix(in oklab, var(--brand-magenta) 92%, var(--surface-1));

    --surface-1: #09090b;
    --surface-2: #18181b;
    --surface-3: #1f1f23;
    --surface-4: #27272a;

    --background: var(--surface-1);
    --foreground: #fafafa;
    --card: var(--surface-2);
    --card-foreground: #fafafa;
    --popover: var(--surface-4);
    --popover-foreground: #fafafa;
    --primary: #fafafa;
    --primary-foreground: var(--background);
    --primary-hover: color-mix(in oklab, var(--primary) 86%, var(--background));
    --secondary: #27272a;
    --secondary-foreground: #fafafa;
    --muted: var(--surface-2);
    --muted-foreground: #a1a1aa;
    --accent: color-mix(in oklab, var(--foreground) 10%, var(--popover));
    --accent-foreground: #fafafa;
    --destructive: #b91c1c;
    --destructive-hover: color-mix(in oklab, var(--destructive) 82%, var(--destructive-foreground));
    --destructive-foreground: #ffffff;
    --scrim: rgb(0 0 0 / 0.62);
    --border: transparent;
    --input: var(--surface-3);
    --ring: var(--primary);

    --shadow-float:
      0 16px 48px rgb(0 0 0 / 0.5), 0 12px 24px rgb(0 0 0 / 0.24), 0 6px 8px rgb(0 0 0 / 0.22),
      0 2px 3px rgb(0 0 0 / 0.12);
    --shadow-modal:
      0 32px 64px rgb(0 0 0 / 0.6), 0 16px 32px rgb(0 0 0 / 0.32), 0 8px 16px rgb(0 0 0 / 0.28),
      0 2px 4px rgb(0 0 0 / 0.16);
    --shadow-hero-lift: 0 24px 48px rgb(220 38 38 / 0.22), inset 0 1px 0 rgb(255 255 255 / 0.06);
    --shadow-hero-fill: 0 12px 24px rgb(220 38 38 / 0.28), inset 0 0 0 1px rgb(255 255 255 / 0.14);
    --shadow-hero-inset: inset 0 1px 0 rgb(255 255 255 / 0.25), inset 0 -8px 16px rgb(0 0 0 / 0.18);
    --shadow-hero-edge: inset 0 0 0 1px rgb(255 255 255 / 0.05), inset 0 1px 0 rgb(255 255 255 / 0.2);
    --shadow-surface-inset: inset 0 1px 0 rgb(255 255 255 / 0.04);
  }
}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--foreground);background:transparent}
  /* 窄栏常驻：min-width:0 + 自适应，保证 240px 不溢出 */
  .widget{--progress-accent:color-mix(in oklab, var(--primary) 72%, var(--background));padding:14px;min-width:0}
  .title{font-size:13px;font-weight:500;color:var(--muted-foreground);margin:0 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .source{font-size:11px;color:var(--muted-foreground);margin:0 0 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ring{display:block;width:100%;max-width:140px;height:auto;margin:0 auto}
  .ring-bg{fill:none;stroke:color-mix(in oklab, var(--foreground) 10%, transparent);stroke-width:10}
  .ring-fg{fill:none;stroke:var(--progress-accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .2s ease}
  .pct{fill:var(--foreground);font-size:22px;font-weight:500;text-anchor:middle;font-family:var(--font-sans)}
  .sub{fill:var(--muted-foreground);font-size:9px;text-anchor:middle;font-family:var(--font-sans)}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;min-width:0}
  .foot span{font-size:12px;color:var(--muted-foreground);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .foot button{border:0.5px solid color-mix(in oklab, var(--foreground) 16%, transparent);background:var(--card);color:var(--foreground);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
  .foot button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<main class="widget">
  <p class="title">今日复习</p>
  <p class="source">本记忆空间 · 间隔复习</p>
  <svg class="ring" viewBox="0 0 120 120" role="img" aria-label="今日复习进度">
    <circle class="ring-bg" cx="60" cy="60" r="50" />
    <circle id="fg" class="ring-fg" cx="60" cy="60" r="50" transform="rotate(-90 60 60)" stroke-dasharray="314.16" stroke-dashoffset="314.16" />
    <text id="pct" class="pct" x="60" y="62">0%</text>
    <text id="sub" class="sub" x="60" y="78">0 / 24</text>
  </svg>
  <div class="foot"><span id="left">还剩 24 张</span><button id="plus" type="button">复习一张</button></div>
</main>
<script>
  var C=2*Math.PI*50; // 周长
  var state={done:0,total:24};
  function derive(s){return {ratio:s.total?s.done/s.total:0,left:Math.max(0,s.total-s.done)};}
  function id(x){return document.getElementById(x);}
  function render(){
    var d=derive(state);
    id('fg').setAttribute('stroke-dashoffset',(C*(1-d.ratio)).toFixed(2));
    id('pct').textContent=Math.round(d.ratio*100)+'%';
    id('sub').textContent=state.done+' / '+state.total;
    id('left').textContent=d.left===0?'今天完成了':'还剩 '+d.left+' 张';
    id('plus').disabled=d.left===0;
  }
  id('plus').addEventListener('click',function(){state.done=Math.min(state.total,state.done+1);render();});
  render();
</script>
</body>
</html>
