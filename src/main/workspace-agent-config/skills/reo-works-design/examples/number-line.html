<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>目标分档</title>
<style>
:root,
[data-theme='light'] {
  color-scheme: light;

  --brand-red: #dc2626;
  --brand-magenta: #d946ef;
  --brand-ember: #ff4704;
  --brand-gradient-from: #ff6a33;
  --brand-gradient-via: #ef4444;
  --brand-gradient-to: #e879f9;
  --brand-gradient: linear-gradient(
    135deg,
    var(--brand-gradient-from) 0%,
    var(--brand-gradient-via) 50%,
    var(--brand-gradient-to) 100%
  );

  --surface-1: #ffffff;
  --surface-2: #f4f4f5;
  --surface-3: #ebebed;
  --surface-4: #ffffff;

  --background: var(--surface-1);
  --foreground: #18181b;
  --card: var(--surface-2);
  --card-foreground: #18181b;
  --popover: var(--surface-4);
  --popover-foreground: #18181b;
  --primary: #18181b;
  --primary-foreground: var(--background);
  --primary-hover: color-mix(in oklab, var(--primary) 86%, var(--background));
  --secondary: #dfe3e8;
  --secondary-foreground: #18181b;
  --muted: var(--surface-2);
  --muted-foreground: #71717a;
  --accent: #d4d9e0;
  --accent-foreground: #18181b;
  --destructive: #b91c1c;
  --destructive-hover: color-mix(in oklab, var(--destructive) 82%, var(--destructive-foreground));
  --destructive-foreground: #ffffff;
  --scrim: rgb(24 24 27 / 0.32);
  --border: transparent;
  --input: var(--surface-3);
  --ring: var(--primary);

  --font-sans: 'Waldenburg', 'Inter', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --font-memory-serif: 'Songti SC', STSong, 'Noto Serif CJK SC', serif;

  --tracking-heading: 0;
  --tracking-heading-lg: 0;
  --tracking-display: 0;
  --tracking-wide: 0.05em;
  --tracking-wider: 0.1em;

  --text-caption: 10px;
  --leading-caption: 1.4;
  --text-ui-xs: 11px;
  --leading-ui-xs: 1.5;
  --text-ui-sm: 12px;
  --leading-ui-sm: 1.6;
  --text-ui-md: 13px;
  --leading-ui-md: 1.6;
  --text-body: 14px;
  --leading-body: 1.6;
  --text-body-lg: 16px;
  --leading-body-lg: 1.6;
  --text-subheading: 18px;
  --leading-subheading: 1.5;
  --text-heading-sm: 20px;
  --leading-heading-sm: 1.4;
  --text-heading: 32px;
  --leading-heading: 1.2;
  --text-heading-lg: 36px;
  --leading-heading-lg: 1.2;
  --text-display: 48px;
  --leading-display: 1.1;

  --font-weight-light: 300;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-bold: 600;

  --spacing-unit: 4px;
  --spacing-4: 4px;
  --spacing-8: 8px;
  --spacing-12: 12px;
  --spacing-16: 16px;
  --spacing-20: 20px;
  --spacing-24: 24px;
  --spacing-28: 28px;
  --spacing-32: 32px;
  --spacing-36: 36px;
  --spacing-40: 40px;
  --spacing-48: 48px;
  --spacing-56: 56px;
  --spacing-64: 64px;
  --spacing-72: 72px;
  --spacing-96: 96px;
  --spacing-160: 160px;

  --container-form: 720px;

  --radius: 16px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-3xl: 28px;
  --radius-4xl: 32px;
  --radius-full: 9999px;

  --shadow-float:
    0 16px 48px rgb(17 24 39 / 0.04), 0 12px 24px rgb(17 24 39 / 0.04),
    0 6px 8px rgb(17 24 39 / 0.02), 0 2px 3px rgb(17 24 39 / 0.02);
  --shadow-modal:
    0 32px 64px rgb(17 24 39 / 0.08), 0 16px 32px rgb(17 24 39 / 0.06),
    0 8px 16px rgb(17 24 39 / 0.04), 0 2px 4px rgb(17 24 39 / 0.03);
  --shadow-hero-lift: 0 24px 48px rgb(220 38 38 / 0.12), inset 0 1px 0 rgb(255 255 255 / 0.6);
  --shadow-hero-fill: 0 12px 24px rgb(220 38 38 / 0.18), inset 0 0 0 1px rgb(255 255 255 / 0.14);
  --shadow-hero-inset: inset 0 1px 0 rgb(255 255 255 / 0.35), inset 0 -8px 16px rgb(0 0 0 / 0.12);
  --shadow-hero-edge: inset 0 0 0 1px rgb(255 255 255 / 0.08), inset 0 1px 0 rgb(255 255 255 / 0.4);
  --shadow-surface-inset: inset 0 1px 0 rgb(0 0 0 / 0.02);
}

[data-theme='dark'] {
  color-scheme: dark;

  --brand-red: #dc2626;
  --brand-magenta: #d946ef;
  --brand-ember: #ff4704;
  --brand-gradient-from: color-mix(in oklab, var(--brand-ember) 92%, var(--surface-1));
  --brand-gradient-via: color-mix(in oklab, var(--brand-red) 92%, var(--surface-1));
  --brand-gradient-to: color-mix(in oklab, var(--brand-magenta) 92%, var(--surface-1));

  --surface-1: #09090b;
  --surface-2: #18181b;
  --surface-3: #1f1f23;
  --surface-4: #27272a;

  --background: var(--surface-1);
  --foreground: #fafafa;
  --card: var(--surface-2);
  --card-foreground: #fafafa;
  --popover: var(--surface-4);
  --popover-foreground: #fafafa;
  --primary: #fafafa;
  --primary-foreground: var(--background);
  --primary-hover: color-mix(in oklab, var(--primary) 86%, var(--background));
  --secondary: #27272a;
  --secondary-foreground: #fafafa;
  --muted: var(--surface-2);
  --muted-foreground: #a1a1aa;
  --accent: color-mix(in oklab, var(--foreground) 10%, var(--popover));
  --accent-foreground: #fafafa;
  --destructive: #b91c1c;
  --destructive-hover: color-mix(in oklab, var(--destructive) 82%, var(--destructive-foreground));
  --destructive-foreground: #ffffff;
  --scrim: rgb(0 0 0 / 0.62);
  --border: transparent;
  --input: var(--surface-3);
  --ring: var(--primary);

  --shadow-float:
    0 16px 48px rgb(0 0 0 / 0.5), 0 12px 24px rgb(0 0 0 / 0.24), 0 6px 8px rgb(0 0 0 / 0.22),
    0 2px 3px rgb(0 0 0 / 0.12);
  --shadow-modal:
    0 32px 64px rgb(0 0 0 / 0.6), 0 16px 32px rgb(0 0 0 / 0.32), 0 8px 16px rgb(0 0 0 / 0.28),
    0 2px 4px rgb(0 0 0 / 0.16);
  --shadow-hero-lift: 0 24px 48px rgb(220 38 38 / 0.22), inset 0 1px 0 rgb(255 255 255 / 0.06);
  --shadow-hero-fill: 0 12px 24px rgb(220 38 38 / 0.28), inset 0 0 0 1px rgb(255 255 255 / 0.14);
  --shadow-hero-inset: inset 0 1px 0 rgb(255 255 255 / 0.25), inset 0 -8px 16px rgb(0 0 0 / 0.18);
  --shadow-hero-edge: inset 0 0 0 1px rgb(255 255 255 / 0.05), inset 0 1px 0 rgb(255 255 255 / 0.2);
  --shadow-surface-inset: inset 0 1px 0 rgb(255 255 255 / 0.04);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    color-scheme: dark;

    --brand-gradient-from: color-mix(in oklab, var(--brand-ember) 92%, var(--surface-1));
    --brand-gradient-via: color-mix(in oklab, var(--brand-red) 92%, var(--surface-1));
    --brand-gradient-to: color-mix(in oklab, var(--brand-magenta) 92%, var(--surface-1));

    --surface-1: #09090b;
    --surface-2: #18181b;
    --surface-3: #1f1f23;
    --surface-4: #27272a;

    --background: var(--surface-1);
    --foreground: #fafafa;
    --card: var(--surface-2);
    --card-foreground: #fafafa;
    --popover: var(--surface-4);
    --popover-foreground: #fafafa;
    --primary: #fafafa;
    --primary-foreground: var(--background);
    --primary-hover: color-mix(in oklab, var(--primary) 86%, var(--background));
    --secondary: #27272a;
    --secondary-foreground: #fafafa;
    --muted: var(--surface-2);
    --muted-foreground: #a1a1aa;
    --accent: color-mix(in oklab, var(--foreground) 10%, var(--popover));
    --accent-foreground: #fafafa;
    --destructive: #b91c1c;
    --destructive-hover: color-mix(in oklab, var(--destructive) 82%, var(--destructive-foreground));
    --destructive-foreground: #ffffff;
    --scrim: rgb(0 0 0 / 0.62);
    --border: transparent;
    --input: var(--surface-3);
    --ring: var(--primary);

    --shadow-float:
      0 16px 48px rgb(0 0 0 / 0.5), 0 12px 24px rgb(0 0 0 / 0.24), 0 6px 8px rgb(0 0 0 / 0.22),
      0 2px 3px rgb(0 0 0 / 0.12);
    --shadow-modal:
      0 32px 64px rgb(0 0 0 / 0.6), 0 16px 32px rgb(0 0 0 / 0.32), 0 8px 16px rgb(0 0 0 / 0.28),
      0 2px 4px rgb(0 0 0 / 0.16);
    --shadow-hero-lift: 0 24px 48px rgb(220 38 38 / 0.22), inset 0 1px 0 rgb(255 255 255 / 0.06);
    --shadow-hero-fill: 0 12px 24px rgb(220 38 38 / 0.28), inset 0 0 0 1px rgb(255 255 255 / 0.14);
    --shadow-hero-inset: inset 0 1px 0 rgb(255 255 255 / 0.25), inset 0 -8px 16px rgb(0 0 0 / 0.18);
    --shadow-hero-edge: inset 0 0 0 1px rgb(255 255 255 / 0.05), inset 0 1px 0 rgb(255 255 255 / 0.2);
    --shadow-surface-inset: inset 0 1px 0 rgb(255 255 255 / 0.04);
  }
}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);font-size:14px;line-height:1.6;color:var(--foreground);background:var(--background)}
  .work{--target-accent:#d85a30;--target-accent-strong:#712b13;max-width:600px;margin:0 auto;padding:24px 20px;min-width:0}
  [data-theme='dark'] .work{--target-accent:#f0997b;--target-accent-strong:#f5c4b3}
  @media (prefers-color-scheme:dark){:root:not([data-theme]) .work{--target-accent:#f0997b;--target-accent-strong:#f5c4b3}}
  h1{font-size:20px;font-weight:500;margin:0 0 4px}
  .caption{margin:0 0 16px;font-size:13px;color:var(--muted-foreground)}
  .card{background:var(--card);border:0.5px solid color-mix(in oklab, var(--foreground) 10%, transparent);border-radius:var(--radius-lg);box-shadow:var(--shadow-surface-inset);padding:14px 14px 8px}
  svg{width:100%;height:auto;display:block;touch-action:none}
  svg:focus{outline:none}
  svg:focus-visible .cursor{stroke:var(--target-accent-strong);stroke-width:2}
  .axis{stroke:color-mix(in oklab, var(--foreground) 16%, transparent);stroke-width:1.5}
  .bucket{stroke:color-mix(in oklab, var(--foreground) 16%, transparent);stroke-width:1}
  .bucket.near{stroke:var(--target-accent);stroke-width:2}
  .blabel{fill:var(--muted-foreground);font-size:11px;font-family:var(--font-sans);text-anchor:middle}
  .blabel.near{fill:var(--target-accent-strong);font-weight:500}
  .scalecap{fill:var(--muted-foreground);font-size:11px;font-family:var(--font-sans);text-anchor:start}
  .link{stroke:var(--target-accent);stroke-width:1.5;stroke-dasharray:3 3}
  .cursor{fill:var(--target-accent);cursor:grab}
  .cursor:active{cursor:grabbing}
  .read{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
  .read .big{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
  .hint{font-size:12px;color:var(--muted-foreground)}
</style>
</head>
<body>
<main class="work">
  <h1>目标分档</h1>
  <p class="caption">把一个连续目标值映射到最近的里程碑档位。拖动圆点，或聚焦后用左右方向键。</p>
  <div class="card">
    <svg id="svg" viewBox="0 0 600 150" role="slider" tabindex="0" aria-label="目标值 0 到 100" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62">
      <text class="scalecap" x="40" y="26">目标</text>
      <line class="axis" x1="40" y1="46" x2="560" y2="46" />
      <line id="link" class="link" x1="0" y1="46" x2="0" y2="104" />
      <circle id="cursor" class="cursor" cx="0" cy="46" r="8" />
      <text class="scalecap" x="40" y="92">档位</text>
      <line class="axis" x1="40" y1="104" x2="560" y2="104" />
      <g id="buckets"></g>
    </svg>
    <div class="read"><span class="big" id="r-target">62</span><span class="hint">最接近：<span id="r-bucket">熟练</span></span></div>
  </div>
</main>
<script>
  var BUCKETS=[{v:0,name:'起步'},{v:25,name:'入门'},{v:50,name:'熟练'},{v:75,name:'精通'},{v:100,name:'大师'}];
  var X0=40,X1=560;
  var state={target:62};
  function x(v){return X0+v/100*(X1-X0);}
  // 派生：最近档位
  function derive(s){
    var best=BUCKETS[0];
    for(var i=1;i<BUCKETS.length;i++){if(Math.abs(BUCKETS[i].v-s.target)<Math.abs(best.v-s.target))best=BUCKETS[i];}
    return {nearest:best};
  }
  function id(x){return document.getElementById(x);}
  function render(){
    var d=derive(state),cx=x(state.target);
    id('cursor').setAttribute('cx',cx.toFixed(1));
    id('link').setAttribute('x1',cx.toFixed(1));
    id('link').setAttribute('x2',x(d.nearest.v).toFixed(1));
    id('r-target').textContent=Math.round(state.target);
    id('r-bucket').textContent=d.nearest.name;
    var svg=id('svg');
    svg.setAttribute('aria-valuenow',String(Math.round(state.target)));
    svg.setAttribute('aria-valuetext',Math.round(state.target)+'，最接近'+d.nearest.name);
    var g=id('buckets');g.textContent='';
    var svgns='http://www.w3.org/2000/svg';
    BUCKETS.forEach(function(b){
      var bx=x(b.v),near=b===d.nearest;
      var tick=document.createElementNS(svgns,'line');
      tick.setAttribute('class','bucket'+(near?' near':''));
      tick.setAttribute('x1',bx.toFixed(1));tick.setAttribute('x2',bx.toFixed(1));
      tick.setAttribute('y1','98');tick.setAttribute('y2','110');
      g.appendChild(tick);
      var lab=document.createElementNS(svgns,'text');
      lab.setAttribute('class','blabel'+(near?' near':''));
      lab.setAttribute('x',bx.toFixed(1));lab.setAttribute('y','128');
      lab.textContent=b.name;
      g.appendChild(lab);
    });
  }
  function setTarget(v){state.target=Math.max(0,Math.min(100,v));render();}
  function fromClientX(clientX){
    var svg=id('svg'),rect=svg.getBoundingClientRect();
    var px=(clientX-rect.left)/rect.width*600;
    return (px-X0)/(X1-X0)*100;
  }
  var dragging=false,svg=id('svg');
  svg.addEventListener('pointerdown',function(e){dragging=true;svg.setPointerCapture(e.pointerId);setTarget(fromClientX(e.clientX));});
  svg.addEventListener('pointermove',function(e){if(dragging)setTarget(fromClientX(e.clientX));});
  svg.addEventListener('pointerup',function(){dragging=false;});
  svg.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'){setTarget(state.target+(e.shiftKey?10:1));e.preventDefault();}
    else if(e.key==='ArrowLeft'){setTarget(state.target-(e.shiftKey?10:1));e.preventDefault();}
  });
  render();
</script>
</body>
</html>
