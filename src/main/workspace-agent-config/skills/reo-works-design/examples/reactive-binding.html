<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>复习强度</title>
<style>
:root,
[data-theme='light'] {
  color-scheme: light;

  --brand-red: #dc2626;
  --brand-magenta: #d946ef;
  --brand-ember: #ff4704;
  --brand-gradient-from: #ff6a33;
  --brand-gradient-via: #ef4444;
  --brand-gradient-to: #e879f9;
  --brand-gradient: linear-gradient(
    135deg,
    var(--brand-gradient-from) 0%,
    var(--brand-gradient-via) 50%,
    var(--brand-gradient-to) 100%
  );

  --surface-1: #ffffff;
  --surface-2: #f4f4f5;
  --surface-3: #ebebed;
  --surface-4: #ffffff;

  --background: var(--surface-1);
  --foreground: #18181b;
  --card: var(--surface-2);
  --card-foreground: #18181b;
  --popover: var(--surface-4);
  --popover-foreground: #18181b;
  --primary: #18181b;
  --primary-foreground: var(--background);
  --primary-hover: color-mix(in oklab, var(--primary) 86%, var(--background));
  --secondary: #dfe3e8;
  --secondary-foreground: #18181b;
  --muted: var(--surface-2);
  --muted-foreground: #71717a;
  --accent: #d4d9e0;
  --accent-foreground: #18181b;
  --destructive: #b91c1c;
  --destructive-hover: color-mix(in oklab, var(--destructive) 82%, var(--destructive-foreground));
  --destructive-foreground: #ffffff;
  --scrim: rgb(24 24 27 / 0.32);
  --border: transparent;
  --input: var(--surface-3);
  --ring: var(--primary);

  --font-sans: 'Waldenburg', 'Inter', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --font-memory-serif: 'Songti SC', STSong, 'Noto Serif CJK SC', serif;

  --tracking-heading: 0;
  --tracking-heading-lg: 0;
  --tracking-display: 0;
  --tracking-wide: 0.05em;
  --tracking-wider: 0.1em;

  --text-caption: 10px;
  --leading-caption: 1.4;
  --text-ui-xs: 11px;
  --leading-ui-xs: 1.5;
  --text-ui-sm: 12px;
  --leading-ui-sm: 1.6;
  --text-ui-md: 13px;
  --leading-ui-md: 1.6;
  --text-body: 14px;
  --leading-body: 1.6;
  --text-body-lg: 16px;
  --leading-body-lg: 1.6;
  --text-subheading: 18px;
  --leading-subheading: 1.5;
  --text-heading-sm: 20px;
  --leading-heading-sm: 1.4;
  --text-heading: 32px;
  --leading-heading: 1.2;
  --text-heading-lg: 36px;
  --leading-heading-lg: 1.2;
  --text-display: 48px;
  --leading-display: 1.1;

  --font-weight-light: 300;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-bold: 600;

  --spacing-unit: 4px;
  --spacing-4: 4px;
  --spacing-8: 8px;
  --spacing-12: 12px;
  --spacing-16: 16px;
  --spacing-20: 20px;
  --spacing-24: 24px;
  --spacing-28: 28px;
  --spacing-32: 32px;
  --spacing-36: 36px;
  --spacing-40: 40px;
  --spacing-48: 48px;
  --spacing-56: 56px;
  --spacing-64: 64px;
  --spacing-72: 72px;
  --spacing-96: 96px;
  --spacing-160: 160px;

  --container-form: 720px;

  --radius: 16px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-3xl: 28px;
  --radius-4xl: 32px;
  --radius-full: 9999px;

  --shadow-float:
    0 16px 48px rgb(17 24 39 / 0.04), 0 12px 24px rgb(17 24 39 / 0.04),
    0 6px 8px rgb(17 24 39 / 0.02), 0 2px 3px rgb(17 24 39 / 0.02);
  --shadow-modal:
    0 32px 64px rgb(17 24 39 / 0.08), 0 16px 32px rgb(17 24 39 / 0.06),
    0 8px 16px rgb(17 24 39 / 0.04), 0 2px 4px rgb(17 24 39 / 0.03);
  --shadow-hero-lift: 0 24px 48px rgb(220 38 38 / 0.12), inset 0 1px 0 rgb(255 255 255 / 0.6);
  --shadow-hero-fill: 0 12px 24px rgb(220 38 38 / 0.18), inset 0 0 0 1px rgb(255 255 255 / 0.14);
  --shadow-hero-inset: inset 0 1px 0 rgb(255 255 255 / 0.35), inset 0 -8px 16px rgb(0 0 0 / 0.12);
  --shadow-hero-edge: inset 0 0 0 1px rgb(255 255 255 / 0.08), inset 0 1px 0 rgb(255 255 255 / 0.4);
  --shadow-surface-inset: inset 0 1px 0 rgb(0 0 0 / 0.02);
}

[data-theme='dark'] {
  color-scheme: dark;

  --brand-red: #dc2626;
  --brand-magenta: #d946ef;
  --brand-ember: #ff4704;
  --brand-gradient-from: color-mix(in oklab, var(--brand-ember) 92%, var(--surface-1));
  --brand-gradient-via: color-mix(in oklab, var(--brand-red) 92%, var(--surface-1));
  --brand-gradient-to: color-mix(in oklab, var(--brand-magenta) 92%, var(--surface-1));

  --surface-1: #09090b;
  --surface-2: #18181b;
  --surface-3: #1f1f23;
  --surface-4: #27272a;

  --background: var(--surface-1);
  --foreground: #fafafa;
  --card: var(--surface-2);
  --card-foreground: #fafafa;
  --popover: var(--surface-4);
  --popover-foreground: #fafafa;
  --primary: #fafafa;
  --primary-foreground: var(--background);
  --primary-hover: color-mix(in oklab, var(--primary) 86%, var(--background));
  --secondary: #27272a;
  --secondary-foreground: #fafafa;
  --muted: var(--surface-2);
  --muted-foreground: #a1a1aa;
  --accent: color-mix(in oklab, var(--foreground) 10%, var(--popover));
  --accent-foreground: #fafafa;
  --destructive: #b91c1c;
  --destructive-hover: color-mix(in oklab, var(--destructive) 82%, var(--destructive-foreground));
  --destructive-foreground: #ffffff;
  --scrim: rgb(0 0 0 / 0.62);
  --border: transparent;
  --input: var(--surface-3);
  --ring: var(--primary);

  --shadow-float:
    0 16px 48px rgb(0 0 0 / 0.5), 0 12px 24px rgb(0 0 0 / 0.24), 0 6px 8px rgb(0 0 0 / 0.22),
    0 2px 3px rgb(0 0 0 / 0.12);
  --shadow-modal:
    0 32px 64px rgb(0 0 0 / 0.6), 0 16px 32px rgb(0 0 0 / 0.32), 0 8px 16px rgb(0 0 0 / 0.28),
    0 2px 4px rgb(0 0 0 / 0.16);
  --shadow-hero-lift: 0 24px 48px rgb(220 38 38 / 0.22), inset 0 1px 0 rgb(255 255 255 / 0.06);
  --shadow-hero-fill: 0 12px 24px rgb(220 38 38 / 0.28), inset 0 0 0 1px rgb(255 255 255 / 0.14);
  --shadow-hero-inset: inset 0 1px 0 rgb(255 255 255 / 0.25), inset 0 -8px 16px rgb(0 0 0 / 0.18);
  --shadow-hero-edge: inset 0 0 0 1px rgb(255 255 255 / 0.05), inset 0 1px 0 rgb(255 255 255 / 0.2);
  --shadow-surface-inset: inset 0 1px 0 rgb(255 255 255 / 0.04);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    color-scheme: dark;

    --brand-gradient-from: color-mix(in oklab, var(--brand-ember) 92%, var(--surface-1));
    --brand-gradient-via: color-mix(in oklab, var(--brand-red) 92%, var(--surface-1));
    --brand-gradient-to: color-mix(in oklab, var(--brand-magenta) 92%, var(--surface-1));

    --surface-1: #09090b;
    --surface-2: #18181b;
    --surface-3: #1f1f23;
    --surface-4: #27272a;

    --background: var(--surface-1);
    --foreground: #fafafa;
    --card: var(--surface-2);
    --card-foreground: #fafafa;
    --popover: var(--surface-4);
    --popover-foreground: #fafafa;
    --primary: #fafafa;
    --primary-foreground: var(--background);
    --primary-hover: color-mix(in oklab, var(--primary) 86%, var(--background));
    --secondary: #27272a;
    --secondary-foreground: #fafafa;
    --muted: var(--surface-2);
    --muted-foreground: #a1a1aa;
    --accent: color-mix(in oklab, var(--foreground) 10%, var(--popover));
    --accent-foreground: #fafafa;
    --destructive: #b91c1c;
    --destructive-hover: color-mix(in oklab, var(--destructive) 82%, var(--destructive-foreground));
    --destructive-foreground: #ffffff;
    --scrim: rgb(0 0 0 / 0.62);
    --border: transparent;
    --input: var(--surface-3);
    --ring: var(--primary);

    --shadow-float:
      0 16px 48px rgb(0 0 0 / 0.5), 0 12px 24px rgb(0 0 0 / 0.24), 0 6px 8px rgb(0 0 0 / 0.22),
      0 2px 3px rgb(0 0 0 / 0.12);
    --shadow-modal:
      0 32px 64px rgb(0 0 0 / 0.6), 0 16px 32px rgb(0 0 0 / 0.32), 0 8px 16px rgb(0 0 0 / 0.28),
      0 2px 4px rgb(0 0 0 / 0.16);
    --shadow-hero-lift: 0 24px 48px rgb(220 38 38 / 0.22), inset 0 1px 0 rgb(255 255 255 / 0.06);
    --shadow-hero-fill: 0 12px 24px rgb(220 38 38 / 0.28), inset 0 0 0 1px rgb(255 255 255 / 0.14);
    --shadow-hero-inset: inset 0 1px 0 rgb(255 255 255 / 0.25), inset 0 -8px 16px rgb(0 0 0 / 0.18);
    --shadow-hero-edge: inset 0 0 0 1px rgb(255 255 255 / 0.05), inset 0 1px 0 rgb(255 255 255 / 0.2);
    --shadow-surface-inset: inset 0 1px 0 rgb(255 255 255 / 0.04);
  }
}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);font-size:14px;line-height:1.6;color:var(--foreground);background:var(--background)}
  .work{--progress-accent:color-mix(in oklab, var(--primary) 72%, var(--background));--progress-accent-soft:color-mix(in oklab, var(--primary) 12%, var(--background));--progress-accent-strong:var(--foreground);max-width:560px;margin:0 auto;padding:24px 20px;min-width:0}
  h1{font-size:20px;font-weight:500;margin:0 0 4px}
  .caption{margin:0 0 20px;font-size:13px;color:var(--muted-foreground)}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .stepper{display:inline-flex;border:0.5px solid color-mix(in oklab, var(--foreground) 16%, transparent);border-radius:var(--radius-sm);overflow:hidden}
  .stepper button{border:0;background:var(--card);color:var(--foreground);font-size:16px;width:34px;height:34px;cursor:pointer}
  input[type=range]{flex:1;min-width:0;accent-color:var(--progress-accent)}
  .val{font-variant-numeric:tabular-nums;font-weight:500;min-width:34px;text-align:right}
  .chips{display:flex;gap:8px;margin-bottom:18px}
  .chip{border:0.5px solid color-mix(in oklab, var(--foreground) 16%, transparent);background:var(--background);color:var(--muted-foreground);border-radius:var(--radius-sm);padding:6px 12px;font-size:13px;cursor:pointer}
  .chip[aria-pressed=true]{background:var(--progress-accent-soft);color:var(--progress-accent-strong);border-color:transparent}
  .card{background:var(--card);border:0.5px solid color-mix(in oklab, var(--foreground) 10%, transparent);border-radius:var(--radius-lg);box-shadow:var(--shadow-surface-inset);padding:16px}
  .bar{height:10px;border-radius:999px;background:color-mix(in oklab, var(--foreground) 10%, transparent);overflow:hidden;margin:2px 0 12px}
  .bar>span{display:block;height:100%;background:var(--progress-accent);border-radius:999px;transition:width .15s ease}
  .out{display:flex;justify-content:space-between;align-items:baseline}
  .out .big{font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
  .status{font-size:13px;color:var(--muted-foreground)}
</style>
</head>
<body>
<main class="work">
  <h1>复习强度</h1>
  <p class="caption">同一个掌握度，用滑块、加减或预设都能调；进度、状态和建议间隔都是它的投影。</p>
  <div class="row">
    <div class="stepper"><button id="dec" type="button" aria-label="减少">−</button><button id="inc" type="button" aria-label="增加">+</button></div>
    <input id="range" type="range" min="0" max="100" step="1" value="50" aria-label="掌握度" />
    <span class="val" id="val">50</span>
  </div>
  <div class="chips" role="group" aria-label="预设">
    <button class="chip" type="button" data-v="20">生疏</button>
    <button class="chip" type="button" data-v="50">熟悉</button>
    <button class="chip" type="button" data-v="80">牢固</button>
  </div>
  <div class="card">
    <div class="bar"><span id="fill"></span></div>
    <div class="out"><span class="status" id="status">熟悉</span><span class="big"><span id="days">7</span> 天后复习</span></div>
  </div>
</main>
<script>
  // 源状态：唯一真值
  var state={strength:50};
  // 派生：纯函数，从源算出间隔与状态
  function derive(s){
    return {
      interval: Math.round(1 + s.strength / 100 * 13),
      status: s.strength < 34 ? '生疏' : s.strength < 67 ? '熟悉' : '牢固'
    };
  }
  // 渲染：把源 + 派生投影到每个控件与读数
  function id(x){return document.getElementById(x);}
  function render(){
    var d=derive(state);
    id('range').value=state.strength;
    id('val').textContent=state.strength;
    id('fill').style.width=state.strength+'%';
    id('status').textContent=d.status;
    id('days').textContent=d.interval;
    var chips=document.querySelectorAll('.chip');
    for(var i=0;i<chips.length;i++){chips[i].setAttribute('aria-pressed',String(Number(chips[i].dataset.v)===state.strength));}
  }
  // 事件：每个入口只改源，再重渲染（双向绑定）
  function setStrength(v){state.strength=Math.max(0,Math.min(100,Math.round(v)));render();}
  id('range').addEventListener('input',function(e){setStrength(Number(e.target.value));});
  id('inc').addEventListener('click',function(){setStrength(state.strength+5);});
  id('dec').addEventListener('click',function(){setStrength(state.strength-5);});
  var chips=document.querySelectorAll('.chip');
  for(var i=0;i<chips.length;i++){chips[i].addEventListener('click',function(e){setStrength(Number(e.currentTarget.dataset.v));});}
  render();
</script>
</body>
</html>
