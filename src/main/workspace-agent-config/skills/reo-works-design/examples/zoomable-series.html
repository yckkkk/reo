<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>复习偏差</title>
<style>
:root,
[data-theme='light'] {
  color-scheme: light;

  --brand-red: #dc2626;
  --brand-magenta: #d946ef;
  --brand-ember: #ff4704;
  --brand-gradient-from: #ff6a33;
  --brand-gradient-via: #ef4444;
  --brand-gradient-to: #e879f9;
  --brand-gradient: linear-gradient(
    135deg,
    var(--brand-gradient-from) 0%,
    var(--brand-gradient-via) 50%,
    var(--brand-gradient-to) 100%
  );

  --surface-1: #ffffff;
  --surface-2: #f4f4f5;
  --surface-3: #ebebed;
  --surface-4: #ffffff;

  --background: var(--surface-1);
  --foreground: #18181b;
  --card: var(--surface-2);
  --card-foreground: #18181b;
  --popover: var(--surface-4);
  --popover-foreground: #18181b;
  --primary: #18181b;
  --primary-foreground: var(--background);
  --primary-hover: color-mix(in oklab, var(--primary) 86%, var(--background));
  --secondary: #dfe3e8;
  --secondary-foreground: #18181b;
  --muted: var(--surface-2);
  --muted-foreground: #71717a;
  --accent: #d4d9e0;
  --accent-foreground: #18181b;
  --destructive: #b91c1c;
  --destructive-hover: color-mix(in oklab, var(--destructive) 82%, var(--destructive-foreground));
  --destructive-foreground: #ffffff;
  --scrim: rgb(24 24 27 / 0.32);
  --border: transparent;
  --input: var(--surface-3);
  --ring: var(--primary);

  --font-sans: 'Waldenburg', 'Inter', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --font-memory-serif: 'Songti SC', STSong, 'Noto Serif CJK SC', serif;

  --tracking-heading: 0;
  --tracking-heading-lg: 0;
  --tracking-display: 0;
  --tracking-wide: 0.05em;
  --tracking-wider: 0.1em;

  --text-caption: 10px;
  --leading-caption: 1.4;
  --text-ui-xs: 11px;
  --leading-ui-xs: 1.5;
  --text-ui-sm: 12px;
  --leading-ui-sm: 1.6;
  --text-ui-md: 13px;
  --leading-ui-md: 1.6;
  --text-body: 14px;
  --leading-body: 1.6;
  --text-body-lg: 16px;
  --leading-body-lg: 1.6;
  --text-subheading: 18px;
  --leading-subheading: 1.5;
  --text-heading-sm: 20px;
  --leading-heading-sm: 1.4;
  --text-heading: 32px;
  --leading-heading: 1.2;
  --text-heading-lg: 36px;
  --leading-heading-lg: 1.2;
  --text-display: 48px;
  --leading-display: 1.1;

  --font-weight-light: 300;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-bold: 600;

  --spacing-unit: 4px;
  --spacing-4: 4px;
  --spacing-8: 8px;
  --spacing-12: 12px;
  --spacing-16: 16px;
  --spacing-20: 20px;
  --spacing-24: 24px;
  --spacing-28: 28px;
  --spacing-32: 32px;
  --spacing-36: 36px;
  --spacing-40: 40px;
  --spacing-48: 48px;
  --spacing-56: 56px;
  --spacing-64: 64px;
  --spacing-72: 72px;
  --spacing-96: 96px;
  --spacing-160: 160px;

  --container-form: 720px;

  --radius: 16px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-3xl: 28px;
  --radius-4xl: 32px;
  --radius-full: 9999px;

  --shadow-float:
    0 16px 48px rgb(17 24 39 / 0.04), 0 12px 24px rgb(17 24 39 / 0.04),
    0 6px 8px rgb(17 24 39 / 0.02), 0 2px 3px rgb(17 24 39 / 0.02);
  --shadow-modal:
    0 32px 64px rgb(17 24 39 / 0.08), 0 16px 32px rgb(17 24 39 / 0.06),
    0 8px 16px rgb(17 24 39 / 0.04), 0 2px 4px rgb(17 24 39 / 0.03);
  --shadow-hero-lift: 0 24px 48px rgb(220 38 38 / 0.12), inset 0 1px 0 rgb(255 255 255 / 0.6);
  --shadow-hero-fill: 0 12px 24px rgb(220 38 38 / 0.18), inset 0 0 0 1px rgb(255 255 255 / 0.14);
  --shadow-hero-inset: inset 0 1px 0 rgb(255 255 255 / 0.35), inset 0 -8px 16px rgb(0 0 0 / 0.12);
  --shadow-hero-edge: inset 0 0 0 1px rgb(255 255 255 / 0.08), inset 0 1px 0 rgb(255 255 255 / 0.4);
  --shadow-surface-inset: inset 0 1px 0 rgb(0 0 0 / 0.02);
}

[data-theme='dark'] {
  color-scheme: dark;

  --brand-red: #dc2626;
  --brand-magenta: #d946ef;
  --brand-ember: #ff4704;
  --brand-gradient-from: color-mix(in oklab, var(--brand-ember) 92%, var(--surface-1));
  --brand-gradient-via: color-mix(in oklab, var(--brand-red) 92%, var(--surface-1));
  --brand-gradient-to: color-mix(in oklab, var(--brand-magenta) 92%, var(--surface-1));

  --surface-1: #09090b;
  --surface-2: #18181b;
  --surface-3: #1f1f23;
  --surface-4: #27272a;

  --background: var(--surface-1);
  --foreground: #fafafa;
  --card: var(--surface-2);
  --card-foreground: #fafafa;
  --popover: var(--surface-4);
  --popover-foreground: #fafafa;
  --primary: #fafafa;
  --primary-foreground: var(--background);
  --primary-hover: color-mix(in oklab, var(--primary) 86%, var(--background));
  --secondary: #27272a;
  --secondary-foreground: #fafafa;
  --muted: var(--surface-2);
  --muted-foreground: #a1a1aa;
  --accent: color-mix(in oklab, var(--foreground) 10%, var(--popover));
  --accent-foreground: #fafafa;
  --destructive: #b91c1c;
  --destructive-hover: color-mix(in oklab, var(--destructive) 82%, var(--destructive-foreground));
  --destructive-foreground: #ffffff;
  --scrim: rgb(0 0 0 / 0.62);
  --border: transparent;
  --input: var(--surface-3);
  --ring: var(--primary);

  --shadow-float:
    0 16px 48px rgb(0 0 0 / 0.5), 0 12px 24px rgb(0 0 0 / 0.24), 0 6px 8px rgb(0 0 0 / 0.22),
    0 2px 3px rgb(0 0 0 / 0.12);
  --shadow-modal:
    0 32px 64px rgb(0 0 0 / 0.6), 0 16px 32px rgb(0 0 0 / 0.32), 0 8px 16px rgb(0 0 0 / 0.28),
    0 2px 4px rgb(0 0 0 / 0.16);
  --shadow-hero-lift: 0 24px 48px rgb(220 38 38 / 0.22), inset 0 1px 0 rgb(255 255 255 / 0.06);
  --shadow-hero-fill: 0 12px 24px rgb(220 38 38 / 0.28), inset 0 0 0 1px rgb(255 255 255 / 0.14);
  --shadow-hero-inset: inset 0 1px 0 rgb(255 255 255 / 0.25), inset 0 -8px 16px rgb(0 0 0 / 0.18);
  --shadow-hero-edge: inset 0 0 0 1px rgb(255 255 255 / 0.05), inset 0 1px 0 rgb(255 255 255 / 0.2);
  --shadow-surface-inset: inset 0 1px 0 rgb(255 255 255 / 0.04);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    color-scheme: dark;

    --brand-gradient-from: color-mix(in oklab, var(--brand-ember) 92%, var(--surface-1));
    --brand-gradient-via: color-mix(in oklab, var(--brand-red) 92%, var(--surface-1));
    --brand-gradient-to: color-mix(in oklab, var(--brand-magenta) 92%, var(--surface-1));

    --surface-1: #09090b;
    --surface-2: #18181b;
    --surface-3: #1f1f23;
    --surface-4: #27272a;

    --background: var(--surface-1);
    --foreground: #fafafa;
    --card: var(--surface-2);
    --card-foreground: #fafafa;
    --popover: var(--surface-4);
    --popover-foreground: #fafafa;
    --primary: #fafafa;
    --primary-foreground: var(--background);
    --primary-hover: color-mix(in oklab, var(--primary) 86%, var(--background));
    --secondary: #27272a;
    --secondary-foreground: #fafafa;
    --muted: var(--surface-2);
    --muted-foreground: #a1a1aa;
    --accent: color-mix(in oklab, var(--foreground) 10%, var(--popover));
    --accent-foreground: #fafafa;
    --destructive: #b91c1c;
    --destructive-hover: color-mix(in oklab, var(--destructive) 82%, var(--destructive-foreground));
    --destructive-foreground: #ffffff;
    --scrim: rgb(0 0 0 / 0.62);
    --border: transparent;
    --input: var(--surface-3);
    --ring: var(--primary);

    --shadow-float:
      0 16px 48px rgb(0 0 0 / 0.5), 0 12px 24px rgb(0 0 0 / 0.24), 0 6px 8px rgb(0 0 0 / 0.22),
      0 2px 3px rgb(0 0 0 / 0.12);
    --shadow-modal:
      0 32px 64px rgb(0 0 0 / 0.6), 0 16px 32px rgb(0 0 0 / 0.32), 0 8px 16px rgb(0 0 0 / 0.28),
      0 2px 4px rgb(0 0 0 / 0.16);
    --shadow-hero-lift: 0 24px 48px rgb(220 38 38 / 0.22), inset 0 1px 0 rgb(255 255 255 / 0.06);
    --shadow-hero-fill: 0 12px 24px rgb(220 38 38 / 0.28), inset 0 0 0 1px rgb(255 255 255 / 0.14);
    --shadow-hero-inset: inset 0 1px 0 rgb(255 255 255 / 0.25), inset 0 -8px 16px rgb(0 0 0 / 0.18);
    --shadow-hero-edge: inset 0 0 0 1px rgb(255 255 255 / 0.05), inset 0 1px 0 rgb(255 255 255 / 0.2);
    --shadow-surface-inset: inset 0 1px 0 rgb(255 255 255 / 0.04);
  }
}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);font-size:14px;line-height:1.6;color:var(--foreground);background:var(--background)}
  .work{--series-positive:#1d9e75;--series-negative:#d85a30;max-width:600px;margin:0 auto;padding:24px 20px;min-width:0}
  [data-theme='dark'] .work{--series-positive:#5dcaa5;--series-negative:#f0997b}
  @media (prefers-color-scheme:dark){:root:not([data-theme]) .work{--series-positive:#5dcaa5;--series-negative:#f0997b}}
  h1{font-size:20px;font-weight:500;margin:0 0 4px}
  .caption{margin:0 0 16px;font-size:13px;color:var(--muted-foreground)}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
  .zoom{display:inline-flex;border:0.5px solid color-mix(in oklab, var(--foreground) 16%, transparent);border-radius:8px;overflow:hidden}
  .zoom button{border:0;background:var(--card);color:var(--muted-foreground);padding:6px 12px;font-size:13px;cursor:pointer}
  .zoom button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}
  .shift{display:flex;align-items:center;gap:8px;flex:1;min-width:160px}
  .shift input{flex:1;min-width:0;accent-color:var(--series-negative)}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--muted-foreground);margin-bottom:6px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .plot{background:var(--card);border:0.5px solid color-mix(in oklab, var(--foreground) 10%, transparent);border-radius:var(--radius-lg);box-shadow:var(--shadow-surface-inset);padding:12px}
  svg{width:100%;height:auto;display:block}
  .zero{stroke:color-mix(in oklab, var(--foreground) 16%, transparent);stroke-width:1;stroke-dasharray:4 4}
  .zerolabel{fill:var(--muted-foreground);font-size:11px;font-family:var(--font-sans);text-anchor:end}
  .dev{fill:none;stroke:var(--muted-foreground);stroke-width:2;stroke-linejoin:round}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .metric{background:var(--card);border:0.5px solid color-mix(in oklab, var(--foreground) 10%, transparent);border-radius:var(--radius-md);box-shadow:var(--shadow-surface-inset);padding:12px 14px}
  .metric .l{font-size:12px;color:var(--muted-foreground);margin-bottom:4px}
  .metric .v{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
  .metric .v .u{font-size:13px;color:var(--muted-foreground);margin-left:2px}
</style>
</head>
<body>
<main class="work">
  <h1>复习偏差</h1>
  <p class="caption">每天实际比计划多或少多少张。多数日子贴近 0，放大纵轴才能看清；拖动平移做整体 what-if。</p>
  <div class="bar">
    <div class="zoom" role="group" aria-label="纵向放大">
      <button type="button" data-z="1" aria-pressed="true">1×</button>
      <button type="button" data-z="4" aria-pressed="false">4×</button>
      <button type="button" data-z="16" aria-pressed="false">16×</button>
    </div>
    <label class="shift">平移<input id="shift" type="range" min="-2" max="2" step="0.25" value="0" aria-label="整体平移" /><span id="o-shift" style="font-variant-numeric:tabular-nums;min-width:40px;text-align:right">+0.0</span></label>
  </div>
  <div class="plot">
    <div class="legend"><span><i style="background:var(--series-positive)"></i>超前</span><span><i style="background:var(--series-negative)"></i>落后</span></div>
    <svg viewBox="0 0 600 220" role="img" aria-label="每天复习相对计划的偏差">
      <line class="zero" x1="36" y1="106" x2="588" y2="106" />
      <text class="zerolabel" x="34" y="110">0</text>
      <path id="dev" class="dev" d="" />
      <g id="dots"></g>
    </svg>
  </div>
  <div class="metrics">
    <div class="metric"><div class="l">平均偏差</div><div class="v"><span id="m-dev">0.00</span><span class="u">张/天</span></div></div>
    <div class="metric"><div class="l">净偏差</div><div class="v"><span id="m-net">+0.0</span><span class="u">张</span></div></div>
  </div>
</main>
<script>
  // 每天实际−计划的偏差，多数贴近 0：1× 看整体，放大才看清近 0 的日子
  var DIFF=[0.2,-0.4,0.9,-0.1,-0.8,1.4,-0.3,0.15,1.1,-1.3,0.4,0.95,-0.2,0.5];
  var N=DIFF.length,L=36,R=588,T=16,B=196,MID=106;
  var maxBase=2; for(var i=0;i<N;i++){maxBase=Math.max(maxBase,Math.abs(DIFF[i]));}
  maxBase+=2; // 给平移留出范围，保证 1× 不裁切
  var basePx=((B-MID)-8)/maxBase;
  var state={zoom:1,shift:0};
  function X(i){return L+i/(N-1)*(R-L);}
  // 坐标变换：缩放围绕 0 基线放大纵向偏差，并裁切到画布内
  function Y(d){return Math.max(T,Math.min(B,MID-d*basePx*state.zoom));}
  // 派生：平移后的偏差序列 + 度量
  function derive(s){
    var series=DIFF.map(function(v){return v+s.shift;});
    var sumAbs=0,net=0;
    for(var i=0;i<N;i++){sumAbs+=Math.abs(series[i]);net+=series[i];}
    return {series:series,meanAbs:sumAbs/N,net:net};
  }
  function pathFor(a){var d='';for(var i=0;i<N;i++){d+=(i===0?'M':'L')+X(i).toFixed(1)+' '+Y(a[i]).toFixed(1)+' ';}return d.trim();}
  function id(x){return document.getElementById(x);}
  function render(){
    var d=derive(state),a=d.series;
    id('dev').setAttribute('d',pathFor(a));
    var dots=id('dots');dots.textContent='';var ns='http://www.w3.org/2000/svg';
    for(var i=0;i<N;i++){
      var c=document.createElementNS(ns,'circle');
      c.setAttribute('cx',X(i).toFixed(1));c.setAttribute('cy',Y(a[i]).toFixed(1));c.setAttribute('r','2.5');
      c.setAttribute('fill',a[i]>=0?'var(--series-positive)':'var(--series-negative)');
      dots.appendChild(c);
    }
    id('o-shift').textContent=(state.shift>=0?'+':'')+state.shift.toFixed(1);
    id('m-dev').textContent=d.meanAbs.toFixed(2);
    id('m-net').textContent=(d.net>=0?'+':'')+d.net.toFixed(1);
  }
  var zb=document.querySelectorAll('.zoom button');
  for(var i=0;i<zb.length;i++){zb[i].addEventListener('click',function(e){
    state.zoom=Number(e.currentTarget.dataset.z);
    for(var j=0;j<zb.length;j++){zb[j].setAttribute('aria-pressed',String(zb[j]===e.currentTarget));}
    render();
  });}
  id('shift').addEventListener('input',function(e){state.shift=Number(e.target.value);render();});
  render();
</script>
</body>
</html>
