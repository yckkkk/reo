<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>复习计划测算</title>
<style>
:root,
[data-theme='light'] {
  color-scheme: light;

  --brand-red: #dc2626;
  --brand-magenta: #d946ef;
  --brand-ember: #ff4704;
  --brand-gradient-from: #ff6a33;
  --brand-gradient-via: #ef4444;
  --brand-gradient-to: #e879f9;
  --brand-gradient: linear-gradient(
    135deg,
    var(--brand-gradient-from) 0%,
    var(--brand-gradient-via) 50%,
    var(--brand-gradient-to) 100%
  );

  --surface-1: #ffffff;
  --surface-2: #f4f4f5;
  --surface-3: #ebebed;
  --surface-4: #ffffff;

  --background: var(--surface-1);
  --foreground: #18181b;
  --card: var(--surface-2);
  --card-foreground: #18181b;
  --popover: var(--surface-4);
  --popover-foreground: #18181b;
  --primary: #18181b;
  --primary-foreground: var(--background);
  --primary-hover: color-mix(in oklab, var(--primary) 86%, var(--background));
  --secondary: #dfe3e8;
  --secondary-foreground: #18181b;
  --muted: var(--surface-2);
  --muted-foreground: #71717a;
  --accent: #d4d9e0;
  --accent-foreground: #18181b;
  --destructive: #b91c1c;
  --destructive-hover: color-mix(in oklab, var(--destructive) 82%, var(--destructive-foreground));
  --destructive-foreground: #ffffff;
  --scrim: rgb(24 24 27 / 0.32);
  --border: transparent;
  --input: var(--surface-3);
  --ring: var(--primary);

  --font-sans: 'Waldenburg', 'Inter', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --font-memory-serif: 'Songti SC', STSong, 'Noto Serif CJK SC', serif;

  --tracking-heading: 0;
  --tracking-heading-lg: 0;
  --tracking-display: 0;
  --tracking-wide: 0.05em;
  --tracking-wider: 0.1em;

  --text-caption: 10px;
  --leading-caption: 1.4;
  --text-ui-xs: 11px;
  --leading-ui-xs: 1.5;
  --text-ui-sm: 12px;
  --leading-ui-sm: 1.6;
  --text-ui-md: 13px;
  --leading-ui-md: 1.6;
  --text-body: 14px;
  --leading-body: 1.6;
  --text-body-lg: 16px;
  --leading-body-lg: 1.6;
  --text-subheading: 18px;
  --leading-subheading: 1.5;
  --text-heading-sm: 20px;
  --leading-heading-sm: 1.4;
  --text-heading: 32px;
  --leading-heading: 1.2;
  --text-heading-lg: 36px;
  --leading-heading-lg: 1.2;
  --text-display: 48px;
  --leading-display: 1.1;

  --font-weight-light: 300;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-bold: 600;

  --spacing-unit: 4px;
  --spacing-4: 4px;
  --spacing-8: 8px;
  --spacing-12: 12px;
  --spacing-16: 16px;
  --spacing-20: 20px;
  --spacing-24: 24px;
  --spacing-28: 28px;
  --spacing-32: 32px;
  --spacing-36: 36px;
  --spacing-40: 40px;
  --spacing-48: 48px;
  --spacing-56: 56px;
  --spacing-64: 64px;
  --spacing-72: 72px;
  --spacing-96: 96px;
  --spacing-160: 160px;

  --container-form: 720px;

  --radius: 16px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-3xl: 28px;
  --radius-4xl: 32px;
  --radius-full: 9999px;

  --shadow-float:
    0 16px 48px rgb(17 24 39 / 0.04), 0 12px 24px rgb(17 24 39 / 0.04),
    0 6px 8px rgb(17 24 39 / 0.02), 0 2px 3px rgb(17 24 39 / 0.02);
  --shadow-modal:
    0 32px 64px rgb(17 24 39 / 0.08), 0 16px 32px rgb(17 24 39 / 0.06),
    0 8px 16px rgb(17 24 39 / 0.04), 0 2px 4px rgb(17 24 39 / 0.03);
  --shadow-hero-lift: 0 24px 48px rgb(220 38 38 / 0.12), inset 0 1px 0 rgb(255 255 255 / 0.6);
  --shadow-hero-fill: 0 12px 24px rgb(220 38 38 / 0.18), inset 0 0 0 1px rgb(255 255 255 / 0.14);
  --shadow-hero-inset: inset 0 1px 0 rgb(255 255 255 / 0.35), inset 0 -8px 16px rgb(0 0 0 / 0.12);
  --shadow-hero-edge: inset 0 0 0 1px rgb(255 255 255 / 0.08), inset 0 1px 0 rgb(255 255 255 / 0.4);
  --shadow-surface-inset: inset 0 1px 0 rgb(0 0 0 / 0.02);
}

[data-theme='dark'] {
  color-scheme: dark;

  --brand-red: #dc2626;
  --brand-magenta: #d946ef;
  --brand-ember: #ff4704;
  --brand-gradient-from: color-mix(in oklab, var(--brand-ember) 92%, var(--surface-1));
  --brand-gradient-via: color-mix(in oklab, var(--brand-red) 92%, var(--surface-1));
  --brand-gradient-to: color-mix(in oklab, var(--brand-magenta) 92%, var(--surface-1));

  --surface-1: #09090b;
  --surface-2: #18181b;
  --surface-3: #1f1f23;
  --surface-4: #27272a;

  --background: var(--surface-1);
  --foreground: #fafafa;
  --card: var(--surface-2);
  --card-foreground: #fafafa;
  --popover: var(--surface-4);
  --popover-foreground: #fafafa;
  --primary: #fafafa;
  --primary-foreground: var(--background);
  --primary-hover: color-mix(in oklab, var(--primary) 86%, var(--background));
  --secondary: #27272a;
  --secondary-foreground: #fafafa;
  --muted: var(--surface-2);
  --muted-foreground: #a1a1aa;
  --accent: color-mix(in oklab, var(--foreground) 10%, var(--popover));
  --accent-foreground: #fafafa;
  --destructive: #b91c1c;
  --destructive-hover: color-mix(in oklab, var(--destructive) 82%, var(--destructive-foreground));
  --destructive-foreground: #ffffff;
  --scrim: rgb(0 0 0 / 0.62);
  --border: transparent;
  --input: var(--surface-3);
  --ring: var(--primary);

  --shadow-float:
    0 16px 48px rgb(0 0 0 / 0.5), 0 12px 24px rgb(0 0 0 / 0.24), 0 6px 8px rgb(0 0 0 / 0.22),
    0 2px 3px rgb(0 0 0 / 0.12);
  --shadow-modal:
    0 32px 64px rgb(0 0 0 / 0.6), 0 16px 32px rgb(0 0 0 / 0.32), 0 8px 16px rgb(0 0 0 / 0.28),
    0 2px 4px rgb(0 0 0 / 0.16);
  --shadow-hero-lift: 0 24px 48px rgb(220 38 38 / 0.22), inset 0 1px 0 rgb(255 255 255 / 0.06);
  --shadow-hero-fill: 0 12px 24px rgb(220 38 38 / 0.28), inset 0 0 0 1px rgb(255 255 255 / 0.14);
  --shadow-hero-inset: inset 0 1px 0 rgb(255 255 255 / 0.25), inset 0 -8px 16px rgb(0 0 0 / 0.18);
  --shadow-hero-edge: inset 0 0 0 1px rgb(255 255 255 / 0.05), inset 0 1px 0 rgb(255 255 255 / 0.2);
  --shadow-surface-inset: inset 0 1px 0 rgb(255 255 255 / 0.04);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    color-scheme: dark;

    --brand-gradient-from: color-mix(in oklab, var(--brand-ember) 92%, var(--surface-1));
    --brand-gradient-via: color-mix(in oklab, var(--brand-red) 92%, var(--surface-1));
    --brand-gradient-to: color-mix(in oklab, var(--brand-magenta) 92%, var(--surface-1));

    --surface-1: #09090b;
    --surface-2: #18181b;
    --surface-3: #1f1f23;
    --surface-4: #27272a;

    --background: var(--surface-1);
    --foreground: #fafafa;
    --card: var(--surface-2);
    --card-foreground: #fafafa;
    --popover: var(--surface-4);
    --popover-foreground: #fafafa;
    --primary: #fafafa;
    --primary-foreground: var(--background);
    --primary-hover: color-mix(in oklab, var(--primary) 86%, var(--background));
    --secondary: #27272a;
    --secondary-foreground: #fafafa;
    --muted: var(--surface-2);
    --muted-foreground: #a1a1aa;
    --accent: color-mix(in oklab, var(--foreground) 10%, var(--popover));
    --accent-foreground: #fafafa;
    --destructive: #b91c1c;
    --destructive-hover: color-mix(in oklab, var(--destructive) 82%, var(--destructive-foreground));
    --destructive-foreground: #ffffff;
    --scrim: rgb(0 0 0 / 0.62);
    --border: transparent;
    --input: var(--surface-3);
    --ring: var(--primary);

    --shadow-float:
      0 16px 48px rgb(0 0 0 / 0.5), 0 12px 24px rgb(0 0 0 / 0.24), 0 6px 8px rgb(0 0 0 / 0.22),
      0 2px 3px rgb(0 0 0 / 0.12);
    --shadow-modal:
      0 32px 64px rgb(0 0 0 / 0.6), 0 16px 32px rgb(0 0 0 / 0.32), 0 8px 16px rgb(0 0 0 / 0.28),
      0 2px 4px rgb(0 0 0 / 0.16);
    --shadow-hero-lift: 0 24px 48px rgb(220 38 38 / 0.22), inset 0 1px 0 rgb(255 255 255 / 0.06);
    --shadow-hero-fill: 0 12px 24px rgb(220 38 38 / 0.28), inset 0 0 0 1px rgb(255 255 255 / 0.14);
    --shadow-hero-inset: inset 0 1px 0 rgb(255 255 255 / 0.25), inset 0 -8px 16px rgb(0 0 0 / 0.18);
    --shadow-hero-edge: inset 0 0 0 1px rgb(255 255 255 / 0.05), inset 0 1px 0 rgb(255 255 255 / 0.2);
    --shadow-surface-inset: inset 0 1px 0 rgb(255 255 255 / 0.04);
  }
}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);font-size:14px;line-height:1.6;color:var(--foreground);background:var(--background)}
  .work{--timeline-accent:color-mix(in oklab, var(--primary) 72%, var(--background));--timeline-label:var(--foreground);max-width:600px;margin:0 auto;padding:24px 20px;min-width:0}
  h1{font-size:20px;font-weight:500;margin:0 0 4px}
  .caption{margin:0 0 18px;font-size:13px;color:var(--muted-foreground)}
  .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 24px;margin-bottom:18px}
  .control{min-width:0}
  .clab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted-foreground);margin-bottom:4px}
  .clab b{color:var(--foreground);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--timeline-accent)}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px}
  .metric{background:var(--card);border:0.5px solid color-mix(in oklab, var(--foreground) 10%, transparent);border-radius:var(--radius-md);box-shadow:var(--shadow-surface-inset);padding:12px 14px;min-width:0}
  .metric .l{font-size:12px;color:var(--muted-foreground);margin-bottom:4px}
  .metric .v{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
  .metric .v .u{font-size:13px;color:var(--muted-foreground);margin-left:2px}
  svg{width:100%;height:auto;display:block}
  .track{stroke:color-mix(in oklab, var(--foreground) 10%, transparent);stroke-width:6;stroke-linecap:round}
  .fill{stroke:var(--timeline-accent);stroke-width:6;stroke-linecap:round}
  .tick{fill:var(--timeline-label)}
  .ticklabel{fill:var(--muted-foreground);font-size:11px;font-family:var(--font-sans);text-anchor:middle}
</style>
</head>
<body>
<main class="work">
  <h1>复习计划测算</h1>
  <p class="caption">每天投入多少、要复习多少张卡，决定完成天数与里程碑——都是这两个源变量的派生。</p>
  <div class="controls">
    <div class="control">
      <div class="clab"><span>每天投入</span><b id="o-min">40 分钟</b></div>
      <input id="min" type="range" min="10" max="120" step="5" value="40" aria-label="每天投入分钟" />
    </div>
    <div class="control">
      <div class="clab"><span>卡片总量</span><b id="o-total">240 张</b></div>
      <input id="total" type="range" min="60" max="600" step="20" value="240" aria-label="卡片总量" />
    </div>
  </div>
  <div class="metrics">
    <div class="metric"><div class="l">每天可复习</div><div class="v"><span id="m-per">20</span><span class="u">张</span></div></div>
    <div class="metric"><div class="l">预计完成</div><div class="v"><span id="m-days">12</span><span class="u">天</span></div></div>
    <div class="metric"><div class="l">约</div><div class="v"><span id="m-weeks">1.7</span><span class="u">周</span></div></div>
  </div>
  <svg viewBox="0 0 600 70" role="img" aria-label="里程碑时间轴">
    <line class="track" x1="20" y1="30" x2="580" y2="30" />
    <line class="fill" x1="20" y1="30" x2="580" y2="30" />
    <g id="ticks"></g>
  </svg>
</main>
<script>
  var MIN_PER_CARD=2;
  var state={dailyMin:40,total:240};
  // 派生链：源 -> 每天张数 -> 天数 -> 周数 -> 里程碑天
  function derive(s){
    var perDay=Math.max(1,Math.floor(s.dailyMin/MIN_PER_CARD));
    var days=Math.ceil(s.total/perDay);
    var marks=[0.25,0.5,0.75,1].map(function(p){return {p:p,day:Math.ceil(s.total*p/perDay)};});
    return {perDay:perDay,days:days,weeks:days/7,marks:marks};
  }
  function id(x){return document.getElementById(x);}
  function render(){
    var d=derive(state);
    id('o-min').textContent=state.dailyMin+' 分钟';
    id('o-total').textContent=state.total+' 张';
    id('m-per').textContent=d.perDay;
    id('m-days').textContent=d.days;
    id('m-weeks').textContent=d.weeks.toFixed(1);
    var x=function(day){return 20+(day/d.days)*560;};
    var g=id('ticks');g.textContent='';
    var svgns='http://www.w3.org/2000/svg';
    d.marks.forEach(function(m){
      var cx=x(m.day),last=m.p>=1;
      var c=document.createElementNS(svgns,'circle');
      c.setAttribute('class','tick');c.setAttribute('cx',cx.toFixed(1));c.setAttribute('cy','30');c.setAttribute('r','4');
      g.appendChild(c);
      var t=document.createElementNS(svgns,'text');
      t.setAttribute('class','ticklabel');
      t.setAttribute('x',(last?Math.min(cx,582):cx).toFixed(1));
      t.setAttribute('y','54');
      if(last)t.setAttribute('style','text-anchor:end');
      t.textContent=Math.round(m.p*100)+'% · 第'+m.day+'天';
      g.appendChild(t);
    });
  }
  id('min').addEventListener('input',function(e){state.dailyMin=Number(e.target.value);render();});
  id('total').addEventListener('input',function(e){state.total=Number(e.target.value);render();});
  render();
</script>
</body>
</html>
